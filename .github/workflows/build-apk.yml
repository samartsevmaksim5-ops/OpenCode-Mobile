name: Build APK

# Builds the Android app with the Linux userland and a current OpenCode server inside, signs it, and publishes it as a
# release (the release also carries the signed manifest the installed apps use to update themselves in place).
#
#   - push a tag such as v1.0.0, or run the workflow by hand from the Actions tab;
#   - the arm64 jobs need a runner of that kind: GitHub provides them free for public repositories.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "OpenCode release tag to bundle (empty: the latest published release)"
        required: false
        default: ""
      publish:
        description: "Publish a release with the APK"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  KOTLIN_VERSION: "2.1.20"
  # Pinned: the compiler used for the checks below is downloaded from the Kotlin releases and compared with this.
  KOTLIN_SHA256: "a118197b0de55ffab2bc8d5cd03a5e39033cfb53383d6931bc761dec0784891a"

jobs:
  verify:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Kotlin compiler
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kotlin.zip" "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          echo "${KOTLIN_SHA256}  $RUNNER_TEMP/kotlin.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf gcc jq

      - name: Static checks
        run: python3 tools/check-static.py

      - name: Type-check against the Android SDK
        run: |
          jar="${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms/android-35/android.jar"
          if [ -f "$jar" ]; then
            bash tools/check-kotlin.sh "$jar"
          else
            echo "android-35 is not installed on this runner; the Gradle build below type-checks instead"
          fi

      - name: Logic tests
        run: |
          bash tools/test-jvm.sh
          bash tools/test-guest.sh
          bash tools/test-ota-plan.sh
          bash tools/test-proot-fetch.sh

  runtime:
    name: Linux userland (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.up.outputs.tag }}
      version: ${{ steps.up.outputs.version }}
      commit: ${{ steps.up.outputs.commit }}
      seq: ${{ steps.seq.outputs.seq }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Resolve the OpenCode release
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.upstream_ref }}
        run: |
          repo="$(jq -r .repo upstream.json)"
          echo "UPSTREAM_REPO=$repo" >> "$GITHUB_ENV"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          req="$REQUESTED"
          if [ -n "$req" ] && ! [[ "$req" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::warning::Requested ref '$req' is not a valid version tag; using latest release of pinned major instead."
            req=""
          fi
          UPSTREAM_REPO="$repo" PINNED_MAJOR="$(jq -r .major upstream.json)" bash runtime/resolve-upstream.sh "$req"

      - name: Fetch the OpenCode sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ steps.up.outputs.repo }}
          ref: ${{ steps.up.outputs.commit }}
          path: upstream-src
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: upstream-src/package.json

      - name: Node version that upstream builds with
        id: node
        run: |
          v="$(grep -oE 'NODE_VERSION = "[0-9.]+"' upstream-src/packages/cli/script/build-node.ts | grep -oE '[0-9.]+' | head -1)"
          echo "version=${v:-26.4.0}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Build the OpenCode server
        run: SRC_DIR="$PWD/upstream-src" bash runtime/build-opencode.sh "${{ steps.up.outputs.tag }}" out/server

      - name: Check the server against what the app needs
        run: bash runtime/contract-test.sh out/server/opencode "${{ steps.up.outputs.version }}"

      - name: Launcher libraries (proot)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf
          bash runtime/fetch-proot.sh out/jniLibs/arm64-v8a
          bash runtime/fetch-wireproxy.sh out/jniLibs/arm64-v8a

      - name: Build date
        id: seq
        run: echo "seq=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Linux userland archive
        run: bash runtime/build-rootfs.sh out/server/opencode out/assets "${{ steps.up.outputs.version }}-${{ steps.seq.outputs.seq }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assets
          path: out/assets/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jnilibs
          path: out/jniLibs/arm64-v8a/*
          if-no-files-found: error
          retention-days: 1

  apk:
    name: APK
    needs: [verify, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version_name: ${{ steps.ver.outputs.name }}
      version_code: ${{ steps.ver.outputs.code }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assets
          path: android/app/src/main/assets

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jnilibs
          path: android/app/src/main/jniLibs/arm64-v8a

      - name: Version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then name="${GITHUB_REF_NAME#v}"; else name="1.0.6"; fi
          # Minutes since the epoch: always increases, and stays far below the 2^31 limit of a version code.
          code=$(( $(date +%s) / 60 ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Signing with your own key."
          else
            echo "::notice::Signing with the public development key from the repository. Add the ANDROID_KEYSTORE_* secrets to sign with your own (see the README)."
          fi

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Accept SDK licenses
        run: yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Assemble
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          UPSTREAM_REF: ${{ needs.runtime.outputs.commit }}
          UPSTREAM_VERSION: ${{ needs.runtime.outputs.version }}
          RUNTIME_SEQ: ${{ needs.runtime.outputs.seq }}
          OTA_REPO: ${{ github.repository }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Check the APK
        run: |
          apk="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          echo "apk=$apk"
          # Read the listing once; matching it with grep -q in a loop is fragile and slow for a 250 MB APK.
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-files.txt"
          for want in assets/rootfs.tgz assets/rootfs.stamp assets/bridge.js lib/arm64-v8a/libproot.so lib/arm64-v8a/libproot-loader.so lib/arm64-v8a/libtalloc.so lib/arm64-v8a/libandroid-shmem.so lib/arm64-v8a/libwireproxy.so; do
            if grep -qxF "$want" "$RUNNER_TEMP/apk-files.txt"; then echo "ok: $want"; else echo "::error::missing from the APK: $want"; exit 1; fi
          done
          apksigner="$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "apksigner=$apksigner"
          # Do not let a missing grep match (the output format differs between build-tools versions) fail the step:
          # only a failed verification does.
          if ! "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apksigner.log" 2>&1; then
            cat "$RUNNER_TEMP/apksigner.log"
            echo "::error::apksigner could not verify the APK signature"
            exit 1
          fi
          grep -iE 'Verifies|certificate (DN|SHA-256)' "$RUNNER_TEMP/apksigner.log" || cat "$RUNNER_TEMP/apksigner.log"
          mkdir -p dist
          cp "$apk" "dist/opencode-android-${{ steps.ver.outputs.name }}.apk"
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk
          path: dist/*.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: [runtime, apk]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apk
          path: dist

      - name: Sign the update manifest
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ needs.apk.outputs.version_code }}
          UPSTREAM_VERSION: ${{ needs.runtime.outputs.version }}
          UPSTREAM_COMMIT: ${{ needs.runtime.outputs.commit }}
          RUNTIME_SEQ: ${{ needs.runtime.outputs.seq }}
        run: |
          # The same key that signed the APK signs the manifest: phones trust an update only if they match.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore" KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD_SECRET" KEY_ALIAS="$KEY_ALIAS_SECRET" KEY_PASSWORD="$KEY_PASSWORD_SECRET"
          else
            export KEYSTORE_FILE="$PWD/android/app/dev.keystore" KEYSTORE_PASSWORD=111111 KEY_ALIAS=opencode-dev KEY_PASSWORD=111111
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          apk="$(ls dist/*.apk | head -1)"
          bash runtime/package-ota.sh --out ota-out --seq "$RUNTIME_SEQ" --apk "$apk" --apk-version-code "$VERSION_CODE" \
            --version "$UPSTREAM_VERSION" --commit "$UPSTREAM_COMMIT" --upstream-repo "$(jq -r .repo upstream.json)"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ needs.apk.outputs.version_name }}
          UPSTREAM_VERSION: ${{ needs.runtime.outputs.version }}
        run: |
          id="$(cat ota-out/release-id)"
          cat > notes.md <<NOTES
          OpenCode for Android $VERSION_NAME, with OpenCode $UPSTREAM_VERSION inside.

          Install the APK on an arm64 phone (Android 8 or newer). The files manifest.json and manifest.json.sig are what
          installed copies of the app use to check and apply updates; they are signed with the key that signed the APK.
          NOTES
          gh release create "ota-$id" ota-out/*.apk ota-out/manifest.json ota-out/manifest.json.sig \
            --title "OpenCode Android $VERSION_NAME (OpenCode $UPSTREAM_VERSION)" --notes-file notes.md --target "$GITHUB_SHA" --latest

      - name: Keep the newest app releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName,isDraft,createdAt \
            | jq -r '[.[] | select((.isDraft | not) and (.tagName | startswith("ota-app-")))] | sort_by(.createdAt) | reverse | .[4:][] | .tagName' \
            | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
